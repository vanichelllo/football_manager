# Публікація гри на GitHub Pages після кожного злиття в main (спершу — тести).
# Один раз увімкніть: Settings → Pages → Source: GitHub Actions.
name: Публікація

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Сайт і окремий офлайн-файл
        run: |
          node tools/version.js "GitHub Pages"
          npm run bundle
          mkdir -p _site
          cp -r index.html sw.js manifest.webmanifest css js data icons _site/
          cp dist/golovnyi-trener.html _site/golovnyi-trener-offline.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
